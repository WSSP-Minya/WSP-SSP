<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbzZ9hsgPh_WU7kbsIEePfJ6UikV8bfgKV6ZaaAJxHYaAXxIqy-otS7s8B60HVY0Weq6/exec";
  const preparingScriptURL = "https://script.google.com/macros/s/AKfycbxDaqWHTarD0vvq5cTQJW8L4mkV7BaOa19cXZNhfyOc_nKkWuJuHSTY-RczC1uaPPg/exec";

   const userEmail = sessionStorage.getItem("email");
   const department = sessionStorage.getItem("department");
   const userRole = sessionStorage.getItem("role");
/* =========================================================
   ACCESS STATE
========================================================= */
let pageAuthorized = false;
/* =========================================================
   DISPLAY DEPARTMENT
========================================================= */
document.getElementById("section").value =  department || "";
/* =========================================================
   VERIFY USER + DEPARTMENT
========================================================= */

async function verifyPageAccess() {

    // ==========================================
    // منع تحميل البيانات بدون Session
    // ==========================================
    if (!userEmail || !department) {
        denyPageAccess(
            "لم يتم تسجيل الدخول."
        );
        return false;
    }
    try {
        const url =
            scriptURL +
            "?action=verifyPageAccess" +
            "&email=" +
            encodeURIComponent(userEmail) +
            "&department=" +
            encodeURIComponent(department);

        console.log("Checking page access...");

        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "HTTP Error: " +
                response.status
            );
        }

        const result = await response.json();
        


        // ======================================
        // المستخدم غير مصرح
        // ======================================

        if (!result || result.status !== "authorized") {
            denyPageAccess(result?.message ||  "غير مصرح لك بالدخول إلى هذا القسم.");
            return false;
        }
        // ======================================
        // تأكيد البيانات القادمة من السيرفر
        // ======================================
        if (String(result.email || "").trim() !== String(userEmail || "").trim()) {
            denyPageAccess("فشل التحقق من هوية المستخدم.");
            return false;
        }

        if (String(result.department || "").trim() !== String(department || "").trim()) {
            denyPageAccess("القسم غير مصرح به لهذا المستخدم.");
            return false;
        }
        // ======================================
        // Authorized
        // ======================================

        pageAuthorized = true;

        console.log(
            "User authorized:",
            result.email,
            result.department
        );
        return true;
    }
    catch (error) {
        console.error("Access verification error:", error);
        denyPageAccess("تعذر التحقق من صلاحية المستخدم.");
        return false;
    }
}
/* =========================================================
   DENY DATA ACCESS
========================================================= */
function denyPageAccess(message) {

    pageAuthorized = false;
    // ==========================================
    // مسح أي بيانات موجودة
    // ==========================================
    stations = [];

    const tableHeader = document.getElementById("tableHeader");
    const tableBody = document.getElementById("tableBody");

    if (tableHeader) {
        tableHeader.innerHTML = "";
    }

    if (tableBody) {
        tableBody.innerHTML = `
            <tr>
                <td class="empty-message">
                    ${message || "غير مصرح لك بالوصول إلى بيانات هذا القسم."}
                </td>
            </tr>
        `;
    }

    // ==========================================
    // منع فتح صفحة المحطة
    // ==========================================
    currentStation = null;

    const stationPage =  document.getElementById("stationPage");
    if (stationPage) {
        stationPage.style.display = "none";
    }
    // ==========================================
    // لا نحذف Session
    // ==========================================
    console.warn("Data access denied:", message);
}

  /* =========================================================
    GLOBAL VARIABLES
  ========================================================= */

  let currentTableYear =
      parseInt(localStorage.getItem("tableYear")) ||
      new Date().getFullYear();

  let stations = [];


  const monthNames = {
      1: "January",
      2: "February",
      3: "March",
      4: "April",
      5: "May",
      6: "June",
      7: "July",
      8: "August",
      9: "September",
      10: "October",
      11: "November",
      12: "December"
  };
  function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

// =========================================================
// LOAD STATIONS - FASTER VERSION
// =========================================================
let stationsLoading = false;
let stationsLoadController = null;

async function loadStations() {

    if (!pageAuthorized) {
        console.warn("loadStations blocked: user is not authorized.");
        return;
    }

    // منع تشغيل تحميل جديد أثناء وجود تحميل حالي
    if (stationsLoading) {
        return;
    }

    stationsLoading = true;

    // إنشاء Controller جديد للتحميل الحالي
    const controller = new AbortController();
    stationsLoadController = controller;

    const signal = controller.signal;

    const branches = [
        "العدوه",
        "مغاغة",
        "بنى مزار",
        "مطاى",
        "سمالوط",
        "المنيا",
        "ابوقرقاص",
        "ملوى",
        "ديرمواس"
    ];

    try {

        // =====================================================
        // تحميل جميع الفروع بالتوازي
        // =====================================================
        const results = await Promise.all(
            branches.map(branch => {

                const url =
                    scriptURL +
                    "?action=getStations&branch=" +
                    encodeURIComponent(branch);

                return fetch(url, {
                    method: "GET",
                    cache: "no-store",
                    signal: signal
                })
                .then(response => {

                    if (!response.ok) {
                        throw new Error(
                            "HTTP " + response.status +
                            " - " + branch
                        );
                    }

                    return response.json();
                })
                .then(data => {

                    if (!data || data.status !== "success") {
                        return [];
                    }

                    const stationNames = Array.isArray(data.stations) ? data.stations : [];
                    const fromDates = Array.isArray(data.fromDates) ? data.fromDates : [];
                    const toDates = Array.isArray(data.toDates) ? data.toDates : [];
                    const branchStations = new Array(stationNames.length);

                    for (let i = 0; i < stationNames.length; i++) {

                        branchStations[i] = {
                            name: stationNames[i],
                            branch: branch,
                            start: convertToMonth(fromDates[i]),
                            end: convertToMonth(toDates[i])
                        };
                    }
                    return branchStations;
                })
                .catch(error => {
                    // الطلب تم إلغاؤه
                    if (error.name === "AbortError") {
                        return [];
                    }
                    console.error(
                        "Error loading branch:",
                        branch,
                        error
                    );
                    return [];
                });
            })
        );
        // =====================================================
        // التأكد أن الصفحة ما زالت مصرح بها
        // =====================================================
        if (!pageAuthorized || signal.aborted) {
            return;
        }
        // =====================================================
        // تجميع المحطات
        // =====================================================
        stations = results.flat();
        // =====================================================
        // رسم الجدول مرة واحدة فقط
        // =====================================================
        renderTable();
    }
    catch (error) {

        if (error.name !== "AbortError") {
            console.error("Error loading all stations:", error);

            stations = [];
            renderTable();
        }
    }
    finally {

        // لا نسمح لطلب قديم بتغيير حالة طلب أحدث
        if (stationsLoadController === controller) {
            stationsLoadController = null;
            stationsLoading = false;
        }
    }
}
// =========================================================
  // INITIALIZE
//=========================================================

function initializeYearSelector() {
    const select = document.getElementById("tableYear");
    select.innerHTML = "";
    for (let year = 2020; year <= 2050; year++) {

        const option = document.createElement("option");
        option.value = year;
        option.textContent =
            year + " / " + (year + 1);

        if (year === currentTableYear) {
            option.selected = true;
        }
        select.appendChild(option);
    }
    updateYearInfo();
}
/* =========================================================
   CHANGE YEAR
========================================================= */
function changeTableYear() {

    currentTableYear = parseInt(document.getElementById("tableYear").value);
    localStorage.setItem("tableYear", currentTableYear);
    updateYearInfo();
    renderTable();
}
/* =========================================================
   YEAR INFO
========================================================= */
function updateYearInfo() {
    document.getElementById("yearInfo").textContent =
        "From July " + currentTableYear + " To June " + (currentTableYear + 1);
}
/* =========================================================
   GET TABLE MONTHS
========================================================= */
function getTableMonths() {

    const result = [];

    for (let month = 7; month <= 12; month++) {

        result.push({
            month: month,
            year: currentTableYear,
            key:
                currentTableYear
                + "-"
                + String(month).padStart(2,"0")
        });
    }

    for (let month = 1; month <= 6; month++) {
        result.push({
            month: month,
            year: currentTableYear + 1,
            key:
                (currentTableYear + 1)
                + "-"
                + String(month).padStart(2,"0")
        });
    }

    return result;
}
/* =========================================================
   GET MONTHS BETWEEN TWO DATES
========================================================= */
function getMonthsBetween(start, end) {

    const result = [];

    if (!start || !end) {
        return result;
    }

    const [startYear, startMonth] = start.split("-").map(Number);
    const [endYear, endMonth] = end.split("-").map(Number);

    let year = startYear;
    let month = startMonth;

    while (year < endYear || (year === endYear && month <= endMonth)) {
        result.push({
            month: month,
            year: year,
            key:
                year +
                "-" +
                String(month).padStart(2, "0")
        });

        month++;
        if (month > 12) {
            month = 1;
            year++;
        }
    }
    return result;
}
/* =========================================================
   GET STATION PROGRESS
========================================================= */
async function getStationProgress(station) {

    if (!station || !station.branch || !station.name) {
        return 0;
    }

    try {
        const url =
            preparingScriptURL +
            "?action=getStages" +
            "&branch=" +
            encodeURIComponent(station.branch) +
            "&station=" +
            encodeURIComponent(station.name);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const result = await response.json();

        if (result && result.status === "success") {

            const progress = Number(result.overallProgress);
            if (Number.isFinite(progress)) {
                return Math.max(0, Math.min(100, progress));
            }
        }

    }
    catch (error) {
        console.error(
            "Error loading progress:",
            station.name,
            error
        );
    }
    return 0;
}
// =========================================================
// RENDER TABLE - OPTIMIZED
// =========================================================

let progressRequestId = 0;

function renderTable() {

    const header =
        document.getElementById("tableHeader");

    const body =
        document.getElementById("tableBody");

    const searchInput =
        document.getElementById("searchInput");

    if (!header || !body) {
        return;
    }


    // =====================================================
    // SEARCH
    // =====================================================

    const search =
        searchInput
            ? searchInput.value.trim().toLowerCase()
            : "";


    // =====================================================
    // FILTER STATIONS
    // =====================================================

    let filtered;


    if (search) {

        filtered = stations.filter(station => {

            const stationName =
                String(station.name || "")
                    .trim()
                    .toLowerCase();

            return stationName.includes(search);

        });

    }
    else {

        const tableStart =
            currentTableYear + "-07";

        const tableEnd =
            (currentTableYear + 1) + "-06";


        filtered = stations.filter(station => {

            if (
                !station.start ||
                !station.end
            ) {
                return false;
            }

            return (
                station.start <= tableEnd &&
                station.end >= tableStart
            );

        });

    }


    // =====================================================
    // TABLE MONTHS
    // =====================================================

    let tableMonths;


    if (
        search &&
        filtered.length > 0
    ) {

        let minStart = null;
        let maxEnd = null;


        for (const station of filtered) {

            if (
                station.start &&
                (!minStart ||
                    station.start < minStart)
            ) {
                minStart = station.start;
            }


            if (
                station.end &&
                (!maxEnd ||
                    station.end > maxEnd)
            ) {
                maxEnd = station.end;
            }

        }


        if (minStart && maxEnd) {

            tableMonths =
                getMonthsBetween(
                    minStart,
                    maxEnd
                );

        }
        else {

            tableMonths =
                getTableMonths();

        }

    }
    else {

        tableMonths =
            getTableMonths();

    }


    // =====================================================
    // BUILD HEADER

// =========================================================
// LOAD TABLE PROGRESS - OPTIMIZED
// =========================================================
async function loadTableProgress(progressRows) {

    if (!Array.isArray(progressRows) || progressRows.length === 0) {
        return;
    }

    const requestId = ++progressRequestId;
    // =====================================================
    // تحميل Progress على دفعات
    // =====================================================
    const batchSize = 8;

    for (let i = 0; i < progressRows.length; i += batchSize) {
        // إذا بدأ renderTable جديد
        // نوقف الطلب القديم
        if (requestId !== progressRequestId) {
            return;
        }

        const batch = progressRows.slice(i, i + batchSize);


        await Promise.all(batch.map(async item => {
                try {
                    const progress = await getStationProgress(item.station);
                    if (requestId !== progressRequestId) {
                        return;
                    }


                    const value = Math.round(Number(progress) || 0);
                    item.fill.style.width = value + "%";

                    item.percent.textContent = value + "%";
                }
                catch (error) {
                    console.error("Progress error:", item.station.name, error);
                }

            })

        );


        // السماح للمتصفح بعرض الجدول
        // قبل الانتقال للدفعة التالية
        await new Promise(
            resolve =>
                setTimeout(resolve, 0)
        );

    }

}

/* =========================================================
   تحويل التاريخ إلى YYYY-MM
========================================================= */

function convertToMonth(value) {

    if (!value) return "";
    /* إذا كانت القيمة بالفعل YYYY-MM */

    if (/^\d{4}-\d{2}$/.test(String(value))) {
        return String(value);
    }
    /*إذا كانت القيمة تاريخ*/

    const date = new Date(value);


    if (isNaN(date.getTime())) {
        return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    return `${year}-${month}`;
}
/*ضبط تاريخ البداية على اول يوم فى الشهر*/
function getFirstDayOfMonth(yearMonth) {
    if (!yearMonth) return "";
    const [year, month] = yearMonth.split("-");
    if (!year || !month) return "";
    return `01/${month}/${year}`;
}
/*ضبط تاريخ النهاية على اخر يوم فى الشهر*/
function getLastDayOfMonth(yearMonth) {
    if (!yearMonth) return "";
    const [year, month] = yearMonth.split("-");
    if (!year || !month) return "";
    
    const lastDay = new Date(year, month, 0).getDate();
    return `${String(lastDay).padStart(2, "0")}/${month}/${year}`;
}

/* =========================================================

========================================================= */
function getCurrentComponents() {

    const type = document.getElementById("type").value;
    if (!type) {
        return [];
    }
    // تقسيم النوع المركب
    const types = type.split("+").map(t => t.trim());
    // تجميع المكونات لكل الأنواع
    const allComponents = types.flatMap(t => components[t] || []);
    // إزالة المكونات المكررة
    return [...new Set(allComponents)];
}
/* =========================================================
   UPDATE COMPONENTS

function updateComponents(savedSelected = null, savedData = null) {

    const grid = document.getElementById("componentsGrid");
    const dataArea = document.getElementById("componentDataArea");

    const list = getCurrentComponents();
    grid.innerHTML = "";
    dataArea.innerHTML = "";

    if (list.length === 0) {

        return;

    const selected = savedSelected !== null ? savedSelected : [];

    list.forEach(component => {

            const checked = selected.includes(component);

                div.classList.add("checked");

            checkbox.addEventListener("change", function() {

/* =========================================================
   LOAD STATION CAPACITY FROM WSSP
========================================================= */

function loadStationCapacity(station) {

    const designCapacity = document.getElementById("designCapacity");
    if (!designCapacity) {
        return;
    }

    // مسح القيمة القديمة
    designCapacity.value = "";
    if (!station || !station.branch || !station.name) {
        return;
    }

    const url = scriptURL + "?action=getStations&branch=" + encodeURIComponent(station.branch);

    fetch(url)
        .then(response => response.json())
        .then(data => {
            console.log("WSSP stations response:", data);

            if (data.status !== "success") {
                console.warn("Unable to load WSSP stations");
                return;
            }

            const stationNames = data.stations || [];
            const capacities = data.capacity || [];

            // البحث عن المحطة
            const index = stationNames.findIndex(name => String(name || "").trim() === String(station.name || "").trim());

            if (index === -1) {
                console.warn("Station not found in WSSP:", station.name);
                return;
            }

            // Capacity من العمود D
            const capacity = capacities[index];
            designCapacity.value = capacity ?? "";

/////////////////////
////حساب progress لكل مرحلة
/////////////////////
function calculateStageProgress(items) {

    if (!Array.isArray(items) || items.length === 0) {
        return 0;
    }

    const completed = items.filter(item => {
        const status = String(item.status || "").trim().toLowerCase();
        const value = String(item.value || "").trim().toLowerCase();

        return (
            status === "completed" ||
            status === "مطابق" ||
            value === "completed" ||
            value === "done" ||
            value === "✓" ||
            value === "✔" ||
            value === "مطابق"
        );

    }).length;

    return Math.round((completed / items.length) * 100);
}

/* =========================================================
   CONVERT DATE TO INPUT DATE FORMAT
========================================================= */
function convertToDateInput(value) {

    if (!value) {
        return "";
    }

    // إذا كانت القيمة بالفعل YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
        return String(value);
    }

    // إذا كانت القيمة YYYY-MM
    if (/^\d{4}-\d{2}$/.test(String(value))) {
        return String(value) + "-01";
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return (year + "-" + month + "-" + day);
}

    try {
        // =================================================
        // تجهيز البنود
        // =================================================
        const items = [];
        stagesData.forEach(item => {
            const row = Number(item.row || 0);

            if (!row) {
                console.warn("Skipping item without valid row:", item);
                return;
            }
            // =============================================
            // البحث عن العنصر في DOM
            // =============================================
            const itemDiv = document.querySelector(`.stage-item[data-row="${row}"]`);

            if (!itemDiv) {
                console.warn("Stage item not found in DOM. Row:", row);
                return;
            }

            // =============================================
            // أزرار الحالة
            // =============================================
            const matchButton = itemDiv.querySelector(".stage-status-btn.match");
            const notMatchButton = itemDiv.querySelector(".stage-status-btn.not-match");
            const reasonInput = itemDiv.querySelector(".stage-reason textarea");
            // =============================================
            // تحديد القيمة
            // =============================================
            let value = "";

            if (matchButton && matchButton.classList.contains("active")) {
                value = "مطابق";
            } else if (notMatchButton && notMatchButton.classList.contains("active")) {
                value = reasonInput ? reasonInput.value.trim(): "";
            }

            // =============================================
            // إضافة البند للقائمة
            // =============================================
            items.push({
                row: row,
                value: value
            });
        });

        // =================================================
        // التأكد من وجود بنود
        // =================================================
        if (items.length === 0) {
            throw new Error("لم يتم العثور على أي بنود صالحة للحفظ.");
        }

        console.log("Saving stages in ONE request:", items.length);
        // =================================================
        // تجهيز الطلب
        // =================================================
        const params = new URLSearchParams();
        params.append("action", "saveStages");
        params.append("branch", branch);
        params.append("station", station);
        params.append("items", JSON.stringify(items));
        // =================================================
        // إرسال طلب واحد فقط
        // =================================================

        const response = await fetch(preparingScriptURL,{
                    method: "POST",
                    body: params
                }
            );

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const result = await response.json();

        console.log("Save stages result:", result);

        // =================================================
        // التحقق من النتيجة
        // =================================================
        if (!result || result.status !== "success") {
            throw new Error(result.message || "فشل حفظ الـ Stages.");
        }
        // =================================================
        // تحديث stagesData المحلي
        // =================================================
        stagesData.forEach(item => {
            const row = Number(item.row || 0);
            const savedItem = items.find(x => Number(x.row) === row);
            if (!savedItem) {
                return;
            }
            const value = String(savedItem.value || "").trim();
            item.value = value;

            if (value === "مطابق") {
                item.status = "completed";
            } else if (value) {
                item.status = "note";
            } else {
                item.status = "";
            }
        });
       
        alert("تم حفظ جميع بنود الـ Stages بنجاح");
        await loadStages(currentStation);
    }
    catch (error) {
        console.error("Save Stages Error:", error);
        alert("حدث خطأ أثناء حفظ الـ Stages:\n" + error.message);
    }
    finally {

        if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent = "Save Stages";
        }
    }
}

        alert("You have been logged out");
        window.location.href = "index.html"; // إعادة توجيه لصفحة تسجيل الدخول
    }
</script>
