<script>
  const scriptURL = "https://script.google.com/macros/s/AKfycbwKI2UTXIWcF2TkkJjCJG0LeDeTq3kqXd5kTYmhaC1RklsoPFML9KhyxfPTdBU89i9-DA/exec";
  const preparingScriptURL = "https://script.google.com/macros/s/AKfycbxoEv2vMzrlj-ruteSaxzbo2uRr-xmIO2GlsgJsh8gVMPmWvF_ARhMFv3JpNzK5Hrqf/exec";

   const userEmail = sessionStorage.getItem("email");
   const department = sessionStorage.getItem("department");
   const userRole = sessionStorage.getItem("role");


/* =========================================================
   ACCESS STATE
========================================================= */
let pageAuthorized = false;
/* =========================================================
   DISPLAY DEPARTMENT
========================================================= */
document.getElementById("section").value =  department || "";
/* =========================================================
   VERIFY USER + DEPARTMENT
========================================================= */

async function verifyPageAccess() {

    // ==========================================
    // منع تحميل البيانات بدون Session
    // ==========================================
    if (!userEmail || !department) {
        denyPageAccess(
            "لم يتم تسجيل الدخول."
        );
        return false;
    }
    try {
        const url =
            scriptURL +
            "?action=verifyPageAccess" +
            "&email=" +
            encodeURIComponent(userEmail) +
            "&department=" +
            encodeURIComponent(department);

        console.log("Checking page access...");

        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });

        if (!response.ok) {
            throw new Error(
                "HTTP Error: " +
                response.status
            );
        }

        const result = await response.json();
        console.log("Page access result:", result);


        // ======================================
        // المستخدم غير مصرح
        // ======================================

        if (!result || result.status !== "authorized") {
            denyPageAccess(result?.message ||  "غير مصرح لك بالدخول إلى هذا القسم.");
            return false;
        }


        // ======================================
        // تأكيد البيانات القادمة من السيرفر
        // ======================================

        if (String(result.email || "").trim() !== String(userEmail || "").trim()) {
            denyPageAccess("فشل التحقق من هوية المستخدم.");
            return false;
        }


        if (String(result.department || "").trim() !== String(department || "").trim()) {
            denyPageAccess("القسم غير مصرح به لهذا المستخدم.");
            return false;
        }


        // ======================================
        // Authorized
        // ======================================

        pageAuthorized = true;

        console.log(
            "User authorized:",
            result.email,
            result.department
        );
        return true;
    }
    catch (error) {
        console.error("Access verification error:", error);
        denyPageAccess("تعذر التحقق من صلاحية المستخدم.");
        return false;
    }
}
/* =========================================================
   DENY DATA ACCESS
========================================================= */
function denyPageAccess(message) {

    pageAuthorized = false;
    // ==========================================
    // مسح أي بيانات موجودة
    // ==========================================
    stations = [];

    const tableHeader = document.getElementById("tableHeader");
    const tableBody = document.getElementById("tableBody");

    if (tableHeader) {
        tableHeader.innerHTML = "";
    }

    if (tableBody) {
        tableBody.innerHTML = `
            <tr>
                <td class="empty-message">
                    ${message || "غير مصرح لك بالوصول إلى بيانات هذا القسم."}
                </td>
            </tr>
        `;
    }

    // ==========================================
    // منع فتح صفحة المحطة
    // ==========================================

    currentStation = null;

    const stationPage =  document.getElementById("stationPage");

    if (stationPage) {
        stationPage.style.display = "none";
    }

    // ==========================================
    // لا نحذف Session
    // ==========================================

    console.warn("Data access denied:", message);
}

  /* =========================================================
    GLOBAL VARIABLES
  ========================================================= */

  let currentTableYear =
      parseInt(localStorage.getItem("tableYear")) ||
      new Date().getFullYear();

  let stations = [];


  const monthNames = {
      1: "January",
      2: "February",
      3: "March",
      4: "April",
      5: "May",
      6: "June",
      7: "July",
      8: "August",
      9: "September",
      10: "October",
      11: "November",
      12: "December"
  };
  function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

  //تحميل المحطات
function loadStations() {
    if (!pageAuthorized) {
            console.warn(
                "loadStations blocked: user is not authorized."
            );
            return;
        }
    const branches = [
        "العدوه",
        "مغاغة",
        "بنى مزار",
        "مطاى",
        "سمالوط",
        "المنيا",
        "ابوقرقاص",
        "ملوى",
        "ديرمواس"
    ];

    // تصفير البيانات قبل التحميل
    stations = [];

    const requests = branches.map(branch => {

        const url = scriptURL +"?action=getStations&branch=" +encodeURIComponent(branch);

        return fetch(url)
            .then(response => response.json())
            .then(data => {

                console.log(
                    "Stations response for",
                    branch,
                    data
                );

                if (data.status !== "success") {
                    return [];
                }

                const result = [];

                const stationNames = data.stations || [];
                
                const fromDates = data.fromDates || [];
                const toDates = data.toDates || [];

                /*مصفوفة للمحطات لاستدعاء البيانات الخاصة بها */

                for (let i = 0; i < stationNames.length; i++) {

                    result.push({
                        name: stationNames[i],
                        branch: branch,
                        start: convertToMonth(fromDates[i]),
                        end: convertToMonth(toDates[i])
                    });
                }
                return result;
            })
            .catch(error => {
                console.error("Error loading branch:", branch, error);
                return [];
            });
    });


    Promise.all(requests)
        .then(results => {

            // تجميع جميع الفروع
            stations = results.flat();

            console.log("All stations loaded:", stations);
            renderTable();
        })
        .catch(error => {
            console.error("Error loading all stations:", error);
            stations = [];
            renderTable();
        });
}


// =========================================================
  // INITIALIZE
//=========================================================

function initializeYearSelector() {
    const select = document.getElementById("tableYear");
    select.innerHTML = "";
    for (let year = 2020; year <= 2050; year++) {

        const option = document.createElement("option");
        option.value = year;
        option.textContent =
            year + " / " + (year + 1);

        if (year === currentTableYear) {
            option.selected = true;
        }
        select.appendChild(option);
    }
    updateYearInfo();
}


/* =========================================================
   CHANGE YEAR
========================================================= */

function changeTableYear() {

    currentTableYear = parseInt(document.getElementById("tableYear").value);
    localStorage.setItem("tableYear", currentTableYear);
    updateYearInfo();
    renderTable();
}


/* =========================================================
   YEAR INFO
========================================================= */

function updateYearInfo() {
    document.getElementById("yearInfo").textContent =
        "From July " + currentTableYear + " To June " + (currentTableYear + 1);
}
/* =========================================================
   GET TABLE MONTHS
========================================================= */

function getTableMonths() {

    const result = [];

    for (let month = 7; month <= 12; month++) {

        result.push({
            month: month,
            year: currentTableYear,
            key:
                currentTableYear
                + "-"
                + String(month).padStart(2,"0")
        });
    }

    for (let month = 1; month <= 6; month++) {
        result.push({
            month: month,
            year: currentTableYear + 1,
            key:
                (currentTableYear + 1)
                + "-"
                + String(month).padStart(2,"0")
        });
    }

    return result;
}
/* =========================================================
   GET MONTHS BETWEEN TWO DATES
========================================================= */

function getMonthsBetween(start, end) {

    const result = [];

    if (!start || !end) {
        return result;
    }

    const [startYear, startMonth] = start.split("-").map(Number);
    const [endYear, endMonth] = end.split("-").map(Number);

    let year = startYear;
    let month = startMonth;

    while (
        year < endYear ||
        (year === endYear && month <= endMonth)
    ) {
        result.push({
            month: month,
            year: year,
            key:
                year +
                "-" +
                String(month).padStart(2, "0")
        });

        month++;
        if (month > 12) {
            month = 1;
            year++;
        }
    }
    return result;
}
/* =========================================================
   GET STATION PROGRESS
========================================================= */

async function getStationProgress(station) {

    if (!station || !station.branch || !station.name) {
        return 0;
    }

    try {

        const url =
            preparingScriptURL +
            "?action=getStages" +
            "&branch=" +
            encodeURIComponent(station.branch) +
            "&station=" +
            encodeURIComponent(station.name);

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const result = await response.json();

        if (
            result &&
            result.status === "success"
        ) {

            const progress =
                Number(result.overallProgress);

            if (Number.isFinite(progress)) {
                return Math.max(0, Math.min(100, progress));
            }
        }

    }
    catch (error) {

        console.error(
            "Error loading progress:",
            station.name,
            error
        );

    }

    return 0;
}

/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable() {

    const header = document.getElementById("tableHeader");
    const body = document.getElementById("tableBody");

    // =====================================================
    // SEARCH
    // =====================================================

    const search = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();
    // =====================================================
    // تحديد المحطات
    // =====================================================
    let filtered = [];
    // =====================================================
    // Search
    // =====================================================
    if (search) {
        filtered = stations.filter(station => {
            const stationName =
                String(station.name || "")
                    .trim()
                    .toLowerCase();
            return stationName.includes(search);
        });
    }
    // =====================================================
    // العام المالي
    // =====================================================
    else {
        const tableStart = currentTableYear + "-07";
        const tableEnd = (currentTableYear + 1) + "-06";


        filtered = stations.filter(station => {
            if (!station.start || !station.end) {
                return false;
            }
            return (
                station.start <= tableEnd &&
                station.end >= tableStart
            );
        });
    }
    // =====================================================
    // تحديد شهور الجدول
    // =====================================================
    let tableMonths = [];
    // =====================================================
    // SEARCH MODE
    // =====================================================
    if (search && filtered.length > 0) {      
        let minStart = null;
        let maxEnd = null;
        filtered.forEach(station => {
            if (station.start) {
                if (!minStart || station.start < minStart) {
                    minStart = station.start;
                }
            }

            if (station.end) {
                if (!maxEnd || station.end > maxEnd) {
                    maxEnd = station.end;
                }
            }
        });

         if (minStart && maxEnd) {

            tableMonths =
                getMonthsBetween(
                    minStart,
                    maxEnd
                );

        }  
        else {
            tableMonths = getTableMonths();
        }
    }
    // =====================================================
    // NORMAL MODE
    // =====================================================
    else {
        tableMonths = getTableMonths();
    }

    // =====================================================
    // HEADER
    // =====================================================

    header.innerHTML = "";

    const headerRow = document.createElement("tr");
    const stationHeader = document.createElement("th");
    stationHeader.textContent = "Station";
    headerRow.appendChild(stationHeader);
    tableMonths.forEach(item => {

        const th = document.createElement("th");

        th.innerHTML =
            escapeHTML(monthNames[item.month]) +
            `<span class="year">${item.year}</span>`;

        headerRow.appendChild(th);
    });

    header.appendChild(headerRow);
    // =====================================================
    // BODY
    // =====================================================
    body.innerHTML = "";
    // =====================================================
    // NO DATA
    // =====================================================
    if (filtered.length === 0) {

        const row = document.createElement("tr");

        const cell = document.createElement("td");

        cell.colSpan = tableMonths.length + 1;
        cell.className = "empty-message";
        cell.textContent = "No Station Found";
        row.appendChild(cell);
        body.appendChild(row);
        return;
    }
    // =====================================================
    // STATIONS
    // =====================================================
      filtered.forEach(station => {

      const row = document.createElement("tr");

      // =================================================
      // Station Name
      // =================================================

      const nameCell = document.createElement("td");

      nameCell.className = "station-cell";

      nameCell.innerHTML = `
          <div class="station-name-wrapper">

              <span
                  class="station-link"
                  onclick="openStation('${escapeHTML(station.name)}')">
                  ${escapeHTML(station.name)}
              </span>

              <div class="station-progress">

                  <div class="progress-track">
                      <div
                          class="progress-fill"
                          style="width:0%">
                      </div>
                  </div>

                  <div class="progress-info">

                      <span>Progress</span>

                      <span class="progress-percent">
                          0%
                      </span>

                  </div>

              </div>

          </div>

/* =========================================================
   تحويل التاريخ إلى YYYY-MM
========================================================= */

function convertToMonth(value) {

    if (!value) return "";
    /* إذا كانت القيمة بالفعل YYYY-MM */

    if (/^\d{4}-\d{2}$/.test(String(value))) {
        return String(value);
    }
    /*إذا كانت القيمة تاريخ*/

    const date = new Date(value);


    if (isNaN(date.getTime())) {
        return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    return `${year}-${month}`;
}
/*ضبط تاريخ البداية على اول يوم فى الشهر*/
function getFirstDayOfMonth(yearMonth) {
    if (!yearMonth) return "";
    const [year, month] = yearMonth.split("-");
    if (!year || !month) return "";
    return `01/${month}/${year}`;
}
/*ضبط تاريخ النهاية على اخر يوم فى الشهر*/
function getLastDayOfMonth(yearMonth) {
    if (!yearMonth) return "";
    const [year, month] = yearMonth.split("-");
    if (!year || !month) return "";
    
    const lastDay = new Date(year, month, 0).getDate();
    return `${String(lastDay).padStart(2, "0")}/${month}/${year}`;
}

/* =========================================================
   LOAD STATION CAPACITY FROM WSSP
========================================================= */

function loadStationCapacity(station) {

    const designCapacity = document.getElementById("designCapacity");

    if (!designCapacity) {
        return;
    }

    // مسح القيمة القديمة
    designCapacity.value = "";

    if (!station || !station.branch || !station.name) {
        return;
    }

    const url =
        scriptURL +
        "?action=getStations&branch=" +
        encodeURIComponent(station.branch);

    fetch(url)
        .then(response => response.json())
        .then(data => {
            console.log("WSSP stations response:", data);

            if (data.status !== "success") {
                console.warn("Unable to load WSSP stations");
                return;
            }

            const stationNames = data.stations || [];
            const capacities = data.capacity || [];

            // البحث عن المحطة
            const index = stationNames.findIndex(name =>
                    String(name || "").trim() ===
                    String(station.name || "").trim()
                );

            if (index === -1) {
                console.warn("Station not found in WSSP:", station.name);
                return;
            }

            // Capacity من العمود D
            const capacity = capacities[index];
            designCapacity.value = capacity ?? "";

            console.log("Design Capacity:", capacity);
        })

        .catch(error => {
            console.error("Error loading capacity:", error);
            designCapacity.value = "";
        });
}

    // =====================================================

    const selectedComponents = [];

    document.querySelectorAll('#componentsGrid input[type="checkbox"]:checked').forEach(checkbox => {
            selectedComponents.push(checkbox.value);
        });

    const componentsText = selectedComponents.join("، ");

    // =====================================================
    // تجهيز البيانات
    // =====================================================

    const params = new URLSearchParams({

            action: "saveGeneralData",
            branch: branch,
            station:station,
            type: type,
            executingAuthority: executingAuthority,
            waterSource: waterSource,
            nearbyStations: nearbyStations,
            alternativeSource: alternativeSource,
            handoverStatus: handoverStatus,
            constructionDate: constructionDate,
            constructionContractor: constructionContractor,
            designCapacity: designCapacity,
            actualCapacity: actualCapacity,
            workers: workers,
            area: area,
            components: componentsText,
            alternativePower: alternativePower,
            serviceArea: serviceArea,
            population:  population,
            networkLength: networkLength
        });

    // =====================================================
    // منع الضغط المتكرر
    // =====================================================
    const saveButton = document.querySelector('button[onclick="saveStationData()"]');
    if (saveButton) {
        saveButton.disabled = true;
    }
    // =====================================================
    // إرسال إلى WSP-Preparing
    // =====================================================
    fetch(preparingScriptURL,{
            method: "POST",
            body: params
        }
    )

    .then(response => {
        if (!response.ok) {
            throw new Error(
                "HTTP Error: " +
                response.status
            );
        }
        return response.json();
    })

    .then(data => {
        console.log("WSP-Preparing response:", data);

        if (
            data.status === "created" ||
            data.status === "updated"
        ) {

            alert(data.message || "تم حفظ البيانات بنجاح");
        }
        else {
            alert(data.message || "حدث خطأ أثناء الحفظ");
        }
    })
    .catch(error => {
        console.error("Save General Error:", error);
        alert("حدث خطأ أثناء حفظ البيانات");
    })
    .finally(() => {
        if (saveButton) {
            saveButton.disabled = false;
        }

    });

}

function loadGeneralData(station) {

        return;

            document.getElementById("constructionContractor").value = data.constructionContractor || "";
            document.getElementById("designCapacity").value = data.designCapacity ?? "";
            document.getElementById("actualCapacity").value = data.actualCapacity ?? "";
            document.getElementById("workers").value = data.workers ?? "";
            document.getElementById("area").value = data.area ?? "";
            document.getElementById("alternativePower").value = data.alternativePower || "";
            document.getElementById("serviceArea").value = data.serviceArea || "";
            document.getElementById("population").value = data.population ?? "";
            document.getElementById("networkLength").value = data.networkLength ?? "";
            // =================================================
            // COMPONENTS
            // =================================================

            let savedComponents = [];

            if (data.components) {
                if (Array.isArray(data.components)) {
                    savedComponents = data.components;
                }
                else {
                    savedComponents = String(data.components)
                        .split("،")
                        .map(item =>
                            item.trim()
                        )
                        .filter(Boolean);
                }
            }
            // =================================================
            // تحديث قائمة المكونات
            // =================================================

            updateComponents(savedComponents);
            console.log("General data loaded successfully");
        })

        .catch(error => {
            console.error("Error loading General Data:", error);
        });
}

/////////////////////
////حساب progress لكل مرحلة
/////////////////////
function calculateStageProgress(items) {

    if (!Array.isArray(items) || items.length === 0) {
        return 0;
    }

    const completed = items.filter(item => {

        const status =
            String(item.status || "")
                .trim()
                .toLowerCase();

        const value =
            String(item.value || "")
                .trim()
                .toLowerCase();

        return (
            status === "completed" ||
            status === "مطابق" ||
            value === "completed" ||
            value === "done" ||
            value === "✓" ||
            value === "✔" ||
            value === "مطابق"
        );

    }).length;

    return Math.round(
        (completed / items.length) * 100
    );
}

/* =========================================================
   CONVERT DATE TO INPUT DATE FORMAT
========================================================= */
function convertToDateInput(value) {

    if (!value) {
        return "";
    }

    // إذا كانت القيمة بالفعل YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
        return String(value);
    }

    // إذا كانت القيمة YYYY-MM
    if (/^\d{4}-\d{2}$/.test(String(value))) {
        return String(value) + "-01";
    }

    const date = new Date(value);

    if (isNaN(date.getTime())) {
        return "";
    }

    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return (year + "-" + month + "-" + day);
}

/* =========================================================
   SAVE ALL STAGES
   حفظ جميع بنود الـ Stages بطلب واحد فقط
========================================================= */

async function saveStages() {
    // =====================================================
    // التأكد من وجود محطة
    // =====================================================
    if (!currentStation) {
        alert("لم يتم تحديد المحطة.");
        return;
    }

    // =====================================================
    // التأكد من وجود بيانات Stages
    // =====================================================
    if (!Array.isArray(stagesData) || stagesData.length === 0) {
        alert("لا توجد بنود لحفظها.");
        return;
    }

    const station = String(currentStation.name || "").trim();
    const branch = String(currentStation.branch || "").trim();

    if (!station) {
        alert("اسم المحطة غير موجود.");
        return;
    }

    // =====================================================
    // زر الحفظ
    // =====================================================
    const saveButton = document.querySelector('button[onclick="saveStages()"]');

    if (saveButton) {
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
    }

    try {

        // =================================================
        // تجهيز البنود
        // =================================================
        const items = [];
        stagesData.forEach(item => {
            const row = Number(item.row || 0);

            if (!row) {
                console.warn("Skipping item without valid row:", item);
                return;
            }
            // =============================================
            // البحث عن العنصر في DOM
            // =============================================
            const itemDiv = document.querySelector(`.stage-item[data-row="${row}"]`);

            if (!itemDiv) {
                console.warn("Stage item not found in DOM. Row:", row);
                return;
            }

            // =============================================
            // أزرار الحالة
            // =============================================
            const matchButton = itemDiv.querySelector(".stage-status-btn.match");
            const notMatchButton = itemDiv.querySelector(".stage-status-btn.not-match");
            const reasonInput = itemDiv.querySelector(".stage-reason textarea");
            // =============================================
            // تحديد القيمة
            // =============================================
            let value = "";

            if (matchButton && matchButton.classList.contains("active")) {
                value = "مطابق";
            }
            else if (notMatchButton && notMatchButton.classList.contains("active")) {
                value = reasonInput ? reasonInput.value.trim(): "";
            }

            // =============================================
            // إضافة البند للقائمة
            // =============================================
            items.push({
                row: row,
                value: value
            });
        });

        // =================================================
        // التأكد من وجود بنود
        // =================================================
        if (items.length === 0) {
            throw new Error("لم يتم العثور على أي بنود صالحة للحفظ.");
        }

        console.log("Saving stages in ONE request:", items.length);
        // =================================================
        // تجهيز الطلب
        // =================================================
        const params = new URLSearchParams();
        params.append("action", "saveStages");
        params.append("branch", branch);
        params.append("station", station);
        params.append("items", JSON.stringify(items));
        // =================================================
        // إرسال طلب واحد فقط
        // =================================================

        const response = await fetch(preparingScriptURL,{
                    method: "POST",
                    body: params
                }
            );

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const result = await response.json();

        console.log("Save stages result:", result);

        // =================================================
        // التحقق من النتيجة
        // =================================================
        if (!result || result.status !== "success") {
            throw new Error(result.message || "فشل حفظ الـ Stages.");
        }
        // =================================================
        // تحديث stagesData المحلي
        // =================================================
        stagesData.forEach(item => {
            const row = Number(item.row || 0);
            const savedItem = items.find(x => Number(x.row) === row);
            if (!savedItem) {
                return;
            }
            const value = String(savedItem.value || "").trim();
            item.value = value;

            if (value === "مطابق") {
                item.status = "completed";
            } else if (value) {
                item.status = "note";
            } else {
                item.status = "";
            }
        });

        // =================================================
        // نجاح
        // =================================================
        alert("تم حفظ جميع بنود الـ Stages بنجاح");
        // =================================================
        // إعادة تحميل البيانات
        // =================================================
        await loadStages(currentStation);
    }
    catch (error) {
        console.error("Save Stages Error:", error);
        alert("حدث خطأ أثناء حفظ الـ Stages:\n" + error.message);
    }
    finally {

        if (saveButton) {
            saveButton.disabled = false;
            saveButton.textContent = "Save Stages";
        }
    }
}
